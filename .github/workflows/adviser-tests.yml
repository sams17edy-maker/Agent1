name: Adviser core tests
on:
  push:
    branches:
      - feature/dynamic-markets-readonly
  pull_request:
    branches:
      - main
      - feature/dynamic-markets-readonly
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test adviser-core.test.js
